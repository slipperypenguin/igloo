---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/issuer_v1.json
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hubble-selfsigned
spec:
  selfSigned: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-ca
spec:
  commonName: hubble-ca.cilium.io
  duration: 87600h # 10y
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: hubble-selfsigned
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBefore: 2160h # 90d
  secretName: hubble-ca
  usages:
    - cert sign
    - crl sign
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/issuer_v1.json
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hubble-ca-issuer
spec:
  ca:
    secretName: hubble-ca
