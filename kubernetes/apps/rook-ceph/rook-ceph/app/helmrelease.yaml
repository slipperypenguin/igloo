---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    csi:
      # Pinned: cephcsi v3.18+ is built for x86-64-v3 (AVX2) and crashes on mbp-node-01 (Ivy Bridge).
      # Rook 1.21 no longer pins CSI images, so ceph-csi-operator would otherwise use its built-in default.
      # Renovate is capped below v3.18.0 in .github/renovate/overrides.json5.
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1
      serviceMonitor:
        enabled: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
